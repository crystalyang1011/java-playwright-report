<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>精力配置洞察报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm 12mm;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif;
            font-size: 10.5pt;
            line-height: 1.7;
            color: #333;
            background: white;
        }

        /* ========== 头部信息 ========== */
        .report-header {
            text-align: center;
            padding: 16px 0 20px;
            border-bottom: 2px solid #2c5aa0;
            margin-bottom: 20px;
        }
        .report-title {
            font-size: 18pt;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .report-subtitle {
            font-size: 10.5pt;
            color: #666;
        }

        /* ========== 章节 ========== */
        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 13pt;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #f0f4f8;
            border-left: 4px solid #2c5aa0;
        }

        /* 健康度评分圆环 */
        .score-section {
            text-align: center;
            margin: 16px 0;
        }
        .score-circle {
            width: 140px;
            height: 140px;
            margin: 0 auto;
            border-radius: 50%;
            border: 3px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .score-value {
            font-size: 38pt;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1;
        }
        .score-label {
            font-size: 10pt;
            color: #666;
            margin-top: 6px;
        }

        /* 总结文字 */
        .summary-box {
            background: #f8f9fa;
            border-left: 3px solid #2c5aa0;
            padding: 12px 16px;
            margin: 12px 0;
            font-size: 10pt;
            color: #444;
            line-height: 1.8;
        }

        /* ========== 图表 ========== */
        .chart-container {
            width: 100%;
            height: 200px;
            margin: 8px 0;
        }
        .chart-container > div {
            left: 50%;
            transform: translate(-50%, -50%);
            top: 50%;
        }
        #donutChart {
            height: 460px;
        }
        #lineChart {
            width: 75%;
            height: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 问题与建议文本 */
        .text-content {
            color: #444;
            font-size: 10pt;
            line-height: 1.8;
            padding: 8px 0;
        }

        /* 免责声明 */
        .disclaimer {
            text-align: center;
            font-size: 8.5pt;
            color: #999;
            margin-top: 20px;
            padding: 10px 0;
            border-top: 1px dashed #ddd;
        }

        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<!-- ========== 报告头部 ========== -->
<div class="report-header">
    <h1 class="report-title" th:text="${data.title}">管理者精力配置洞察报告</h1>
    <p class="report-subtitle">
        被分析人：<span th:text="${data.analyzedPerson}">张总监</span>
        （<span th:text="${data.department}">销售部</span>）
    </p>
</div>

<!-- ========== 第一部分：精力健康度概览 ========== -->
<div class="section">
    <div class="section-title">精力健康度概览</div>

    <div class="score-section">
        <div class="score-circle">
            <div class="score-value" th:text="${data.healthScore}">85</div>
            <div class="score-label">精力健康度评分</div>
        </div>
    </div>

    <p th:text="${data.精力总结}">精力总结...</p>
</div>

<!-- ========== 第二部分：时间分配与职责匹配度分析 ========== -->
<div class="section">
    <div class="section-title">时间分配与职责匹配度分析</div>
    <div id="donutChart" class="chart-container"></div>
    <div id="lineChart" class="chart-container"></div>
    <p style="text-align: center; font-style: italic; color: #666; font-size: 10pt; margin-top: 8px;" th:text="'关键洞察：' + ${data.关键洞察}">关键洞察：...</p>
</div>

<!-- ========== 第三部分：问题诊断与风险预警 ========== -->
<div class="section">
    <div class="section-title">问题诊断与风险预警</div>
    <div class="text-content" th:text="${data.问题诊断与风险预警}">
        问题诊断...
    </div>
</div>

<!-- ========== 第四部分：精力平衡建议 ========== -->
<div class="section">
    <div class="section-title">精力平衡建议</div>
    <div class="text-content" th:text="${data.精力平衡建议}">
        精力平衡建议...
    </div>
</div>

<!-- ========== 免责声明 ========== -->
<div class="disclaimer">内容由AI生成，仅供参考</div>

<!-- ==================== 数据注入 ==================== -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const chartData = {
        业务类别占比: /*[[${data.业务类别占比}]]*/ [],
        职责对比: /*[[${data.职责对比}]]*/ []
    };
    /*]]>*/
</script>

<!-- ==================== ECharts 初始化 ==================== -->
<script>
    // ---------- 环形图：业务类别占比 ----------
    const donutChart = echarts.init(document.getElementById('donutChart'));
    const donutData = chartData.业务类别占比.map(function(item) {
        const key = Object.keys(item)[0];
        return { name: key, value: item[key] };
    });
    donutChart.setOption({
        animation: false,
        tooltip: { trigger: 'item', formatter: '{b}: {c}% ({d}%)' },
        series: [{
            name: '业务类别',
            type: 'pie',
            radius: ['35%', '75%'],
            center: ['50%', '50%'],
            avoidLabelOverlap: true,
            itemStyle: { borderRadius: 3, borderColor: '#fff', borderWidth: 2 },
            label: { show: true, formatter: '{b}\n{c}%', fontSize: 14 },
            emphasis: { label: { show: true, fontSize: 14, fontWeight: 'bold' } },
            data: donutData,
            color: ['#2c5aa0', '#4a90d9', '#7ab8f5', '#a8d4f7', '#d6e9f7']
        }]
    });

    // ---------- 折线图：职责对比 ----------
    const lineChart = echarts.init(document.getElementById('lineChart'));
    const dutyData = chartData.职责对比;
    const categories = dutyData.map(function(item) { return item.name; });
    const actualValues = dutyData.map(function(item) { return item.actual; });
    const idealValues = dutyData.map(function(item) { return item.ideal; });

    lineChart.setOption({
        animation: false,
        tooltip: { trigger: 'axis' },
        legend: { data: ['实际投入', '理想状态'], top: 0, textStyle: { fontSize: 14 } },
        grid: { left: '3%', right: '4%', bottom: '3%', top: '15%', containLabel: true },
        xAxis: { type: 'category', boundaryGap: false, data: categories, axisLabel: { fontSize: 14 } },
        yAxis: { type: 'value', axisLabel: { fontSize: 14 } },
        series: [
            { name: '实际投入', type: 'line', symbol: 'circle', symbolSize: 6,
              lineStyle: { width: 2, color: '#2c5aa0' }, itemStyle: { color: '#2c5aa0' }, data: actualValues },
            { name: '理想状态', type: 'line', symbol: 'circle', symbolSize: 6,
              lineStyle: { width: 2, color: '#52c41a' }, itemStyle: { color: '#52c41a' }, data: idealValues }
        ]
    });

    // 标记渲染完成
    document.body.setAttribute('data-charts-ready', 'true');
</script>

</body>
</html>
