<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>精力配置洞察报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm 12mm;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif;
            font-size: 10.5pt;
            line-height: 1.7;
            color: #333;
            background: white;
        }

        /* ========== 头部信息 ========== */
        .report-header {
            text-align: center;
            padding: 16px 0 20px;
            border-bottom: 2px solid #2c5aa0;
            margin-bottom: 20px;
        }
        .report-title {
            font-size: 18pt;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .report-subtitle {
            font-size: 10.5pt;
            color: #666;
        }

        /* ========== 第一部分：概览 ========== */
        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 13pt;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #f0f4f8;
            border-left: 4px solid #2c5aa0;
        }

        /* 健康度评分圆环 */
        .score-section {
            text-align: center;
            margin: 16px 0;
        }
        .score-circle {
            width: 140px;
            height: 140px;
            margin: 0 auto;
            border-radius: 50%;
            border: 3px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .score-value {
            font-size: 38pt;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1;
        }
        .score-label {
            font-size: 10pt;
            color: #666;
            margin-top: 6px;
        }

        /* 总结文字 */
        .summary-box {
            background: #f8f9fa;
            border-left: 3px solid #2c5aa0;
            padding: 12px 16px;
            margin: 12px 0;
            font-size: 10pt;
            color: #444;
            line-height: 1.8;
        }

        /* ========== 第二部分：图表分析 ========== */
        .chart-container {
            width: 100%;
            height: 200px;
            margin: 8px 0;
        }

        /* 关键洞察 */
        .insight-box {
            background: #fff8e6;
            border: 1px solid #ffd591;
            border-radius: 4px;
            padding: 10px 14px;
            margin: 12px 0;
        }
        .insight-label {
            font-weight: bold;
            color: #d46b08;
            font-size: 10pt;
            margin-bottom: 4px;
        }
        .insight-text {
            color: #555;
            font-size: 9.5pt;
            line-height: 1.7;
        }

        /* ========== 第三部分：问题与建议 ========== */
        .problem-item {
            margin-bottom: 12px;
            padding-left: 14px;
            position: relative;
        }
        .problem-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 7px;
            width: 5px;
            height: 5px;
            background: #f5222d;
            border-radius: 50%;
        }
        .problem-title {
            font-weight: bold;
            color: #1a1a1a;
            font-size: 10pt;
            margin-bottom: 2px;
        }
        .problem-content {
            color: #555;
            font-size: 9.5pt;
            line-height: 1.6;
        }

        .suggestion-item {
            margin-bottom: 12px;
            padding-left: 14px;
            position: relative;
        }
        .suggestion-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 7px;
            width: 5px;
            height: 5px;
            background: #52c41a;
            border-radius: 50%;
        }
        .suggestion-title {
            font-weight: bold;
            color: #1a1a1a;
            font-size: 10pt;
            margin-bottom: 4px;
        }
        .suggestion-detail {
            color: #555;
            font-size: 9.5pt;
            line-height: 1.6;
            padding-left: 10px;
            position: relative;
        }
        .suggestion-detail::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #52c41a;
        }

        /* 免责声明 */
        .disclaimer {
            text-align: center;
            font-size: 8.5pt;
            color: #999;
            margin-top: 20px;
            padding: 10px 0;
            border-top: 1px dashed #ddd;
        }

        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<!-- ========== 报告头部 ========== -->
<div class="report-header">
    <h1 class="report-title" th:text="${data.title}">管理者精力配置洞察报告</h1>
    <p class="report-subtitle">
        被分析人：<span th:text="${data.analyzedPerson}">张总监</span>
        （<span th:text="${data.department}">销售部</span>）
    </p>
</div>

<!-- ========== 第一部分：精力健康度概览 ========== -->
<div class="section">
    <div class="section-title">一、精力健康度概览</div>

    <div class="score-section">
        <div class="score-circle">
            <div class="score-value" th:text="${data.healthScore}">85</div>
            <div class="score-label">精力健康度评分</div>
        </div>
    </div>

    <div class="summary-box" th:text="${data.summaryText}">
        45%用于会议审批（低效会议占比38%），仅28%聚焦客户开发...
    </div>
</div>

<!-- ========== 第二部分：时间分配与职责匹配度分析 ========== -->
<div class="section">
    <div class="section-title">二、时间分配与职责匹配度分析</div>

    <!-- 环形图 -->
    <div id="donutChart" class="chart-container"></div>

    <!-- 折线图 -->
    <div id="lineChart" class="chart-container"></div>

    <!-- 关键洞察 -->
    <div class="insight-box">
        <div class="insight-label">关键洞察</div>
        <div class="insight-text" th:text="${data.keyInsight}">
            团队管理职责要求35%时间，实际仅22%（缺口13%）...
        </div>
    </div>
</div>

<!-- ========== 第三部分：问题诊断与精力平衡建议 ========== -->
<div class="section">
    <div class="section-title">三、问题诊断与精力平衡建议</div>

    <!-- 问题诊断 -->
    <div th:each="problem, iter : ${data.problems}" class="problem-item">
        <div class="problem-title">
            <span th:text="${iter.count}">1</span>、<span th:text="${problem.title}">时间碎片化</span>
        </div>
        <div class="problem-content" th:text="${problem.content}">
            平均会议时长25分钟...
        </div>
    </div>

    <!-- 精力平衡建议 -->
    <div style="margin-top: 16px;">
        <div style="font-weight: bold; font-size: 10pt; color: #1a1a1a; margin-bottom: 8px;">精力平衡建议</div>
        <div th:each="suggestion, iter : ${data.suggestions}" class="suggestion-item">
            <div class="suggestion-title">
                <span th:text="${iter.count}">1</span>、<span th:text="${suggestion.title}">时间投资建议</span>
            </div>
            <div th:each="detail : ${suggestion.details}" class="suggestion-detail" th:text="${detail}">
                建议内容...
            </div>
        </div>
    </div>
</div>

<!-- ========== 免责声明 ========== -->
<div class="disclaimer" th:text="${data.disclaimer}">内容由AI生成，仅供参考</div>

<!-- ==================== 数据注入 ==================== -->
<script th:inline="javascript">
    /*<![CDATA[*/
    var chartData = {
        businessItems: /*[[${data.businessItems}]]*/ [],
        dutyComparisons: /*[[${data.dutyComparisons}]]*/ []
    };
    /*]]>*/
</script>

<!-- ==================== ECharts 初始化 ==================== -->
<script>
    // ---------- 环形图：时间分配 ----------
    var donutChart = echarts.init(document.getElementById('donutChart'));
    var donutData = chartData.businessItems.map(function(item) {
        return { name: item.name, value: item.actualValue };
    });
    donutChart.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c}小时 ({d}%)' },
        legend: { orient: 'vertical', right: 8, top: 'center', textStyle: { fontSize: 9 } },
        series: [{
            name: '实际投入',
            type: 'pie',
            radius: ['40%', '65%'],
            center: ['35%', '50%'],
            avoidLabelOverlap: true,
            itemStyle: { borderRadius: 3, borderColor: '#fff', borderWidth: 2 },
            label: { show: true, formatter: '{b}\n{c}', fontSize: 9 },
            emphasis: { label: { show: true, fontSize: 11, fontWeight: 'bold' } },
            data: donutData,
            color: ['#2c5aa0', '#4a90d9', '#7ab8f5', '#a8d4f7', '#d6e9f7']
        }]
    });

    // ---------- 折线图：职责对比 ----------
    var lineChart = echarts.init(document.getElementById('lineChart'));
    var dutyNames = chartData.dutyComparisons.map(function(item) { return item.dutyName; });
    var actualValues = chartData.dutyComparisons.map(function(item) { return item.actualValue; });
    var idealValues = chartData.dutyComparisons.map(function(item) { return item.idealValue; });
    lineChart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['实际投入', '理想状态'], top: 0, textStyle: { fontSize: 9 } },
        grid: { left: '3%', right: '4%', bottom: '3%', top: '15%', containLabel: true },
        xAxis: { type: 'category', boundaryGap: false, data: dutyNames, axisLabel: { fontSize: 9 } },
        yAxis: { type: 'value', axisLabel: { fontSize: 9 } },
        series: [
            { name: '实际投入', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
              lineStyle: { width: 2, color: '#2c5aa0' }, itemStyle: { color: '#2c5aa0' }, data: actualValues },
            { name: '理想状态', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
              lineStyle: { width: 2, color: '#52c41a', type: 'dashed' }, itemStyle: { color: '#52c41a' }, data: idealValues }
        ]
    });

    // 标记渲染完成
    document.body.setAttribute('data-charts-ready', 'true');
</script>

</body>
</html>
