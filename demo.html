<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报表下载</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
        }
        .card {
            background: white;
            padding: 48px 64px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            padding: 14px 48px;
            background: #2c5aa0;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: #1e3d6e; }
        .note {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>销售报表下载</h1>
        <p>点击下方按钮下载 PDF 报表</p>

        <!-- 方式一：直接用 a 标签下载 -->
        <a class="btn" href="http://localhost:8080/api/schedule/report/download" download>
            下载 PDF 报表
        </a>

        <p class="note">
            后端服务需运行在 http://localhost:8080<br>
            数据由后端生成，含 ECharts 图表
        </p>
    </div>
</body>
</html>
